name: Download and inspect PS2 ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Iso repository
        uses: actions/checkout@v4

      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file

      - name: Download ISO from Yandex Disk
        env:
          YANDEX_PUBLIC_URL: https://disk.yandex.ru/d/B5b8qaTTemfe1w
        run: |
          set -euo pipefail
          API_URL="https://cloud-api.yandex.net/v1/disk/public/resources/download"
          HREF="$(curl --fail --silent --show-error --get \
            --data-urlencode "public_key=$YANDEX_PUBLIC_URL" \
            "$API_URL" | jq -r '.href // empty')"
          if [ -z "$HREF" ]; then
            echo "::error::Yandex Disk did not return a download URL. The link may require access or confirmation."
            exit 1
          fi
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$RUNNER_TEMP/original.iso" "$HREF"
          test -s "$RUNNER_TEMP/original.iso"
          echo "Downloaded file:"
          ls -lh "$RUNNER_TEMP/original.iso"
          file "$RUNNER_TEMP/original.iso"
          sha256sum "$RUNNER_TEMP/original.iso" | tee iso/sha256.txt

      - name: Inspect ISO filesystem and list files
        run: |
          set -euo pipefail
          {
            echo "# ISO inspection report"
            echo
            echo "- Source: public Yandex Disk link"
            echo "- File: original.iso"
            echo "- Size: $(stat -c '%s bytes' "$RUNNER_TEMP/original.iso")"
            echo "- SHA-256: $(sha256sum "$RUNNER_TEMP/original.iso" | awk '{print $1}')"
            echo
            echo "## 7-Zip listing"
            echo ' ```text'
            7z l -slt "$RUNNER_TEMP/original.iso"
            echo ' ```'
          } > iso/inspection-report.md

      - name: Validate ZDIR index against all four ZZDATA archives
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data"
          mkdir -p "$GAME_DIR"
          7z x -y -o"$GAME_DIR" "$RUNNER_TEMP/original.iso" \
            "NFSUNDER/ZDIR.BIN" \
            "NFSUNDER/ZZDATA0.BIN" \
            "NFSUNDER/ZZDATA1.BIN" \
            "NFSUNDER/ZZDATA2.BIN" \
            "NFSUNDER/ZZDATA3.BIN"
          test -s "$GAME_DIR/NFSUNDER/ZDIR.BIN"
          for i in 0 1 2 3; do
            test -s "$GAME_DIR/NFSUNDER/ZZDATA$i.BIN"
          done

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_inspect.py" \
            --output "$RUNNER_TEMP/zdir_inspect.py"

          python3 "$RUNNER_TEMP/zdir_inspect.py" \
            "$GAME_DIR/NFSUNDER/ZDIR.BIN" \
            --archive "0=$GAME_DIR/NFSUNDER/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/NFSUNDER/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/NFSUNDER/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/NFSUNDER/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/zdir-summary.json"

          python3 - "$RUNNER_TEMP/zdir-summary.json" iso/zdir-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          lines = [
              "# ZDIR / ZZDATA validation report",
              "",
              f"- Index size: {data['index_bytes']:,} bytes",
              f"- Record size: {data['record_size']} bytes",
              f"- Records: {data['record_count']:,}",
              f"- Offset unit: {data['sector_size']:,}-byte sectors",
              "- Archive boundary validation: performed against all four extracted archives",
              f"- Validation problems: {data['problem_count']}",
              "",
              "## Archive distribution",
              "",
              "| Archive | Actual size (bytes) | Entries | Declared payload bytes | Highest referenced end offset |",
              "|---|---:|---:|---:|---:|",
          ]
          for aid, item in data["archives"].items():
              lines.append(
                  f"| {item['file']} | {item['archive_bytes']:,} | "
                  f"{item['entry_count']:,} | {item['declared_payload_bytes']:,} | "
                  f"{item['max_end_offset']:,} |"
              )
          if data["problems"]:
              lines.extend(["", "## First validation problems", ""])
              lines.extend(f"- {problem}" for problem in data["problems"])
          else:
              lines.extend(["", "All index entries fit within their referenced archive files."])
          lines.extend([
              "",
              "Only index metadata was committed. The ISO, ZDIR binary, and ZZDATA payloads were temporary runner files.",
              "",
          ])
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: Build resource filename catalogue
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Ekey/NFS.BIN.Tool/main/NFS.Unpacker/NFS.Unpacker/Projects/FileNames.list" \
            --output "$RUNNER_TEMP/FileNames.list"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_inspect.py" \
            --output "$RUNNER_TEMP/zdir_inspect.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_catalog.py" \
            --output "$RUNNER_TEMP/zdir_catalog.py"

          python3 "$RUNNER_TEMP/zdir_catalog.py" \
            "$GAME_DIR/ZDIR.BIN" \
            --names "$RUNNER_TEMP/FileNames.list" \
            --csv iso/resource-catalogue.csv \
            --summary "$RUNNER_TEMP/catalogue-summary.json"

          python3 - "$RUNNER_TEMP/catalogue-summary.json" iso/resource-catalogue-report.md <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          lines = [
              "# Resource filename catalogue",
              "",
              f"- ZDIR entries: {data['entry_count']:,}",
              f"- Candidate paths in external dictionary: {data['name_list_lines']:,}",
              f"- Resolved names: {data['resolved']:,}",
              f"- Unresolved hashes: {data['unresolved']:,}",
              f"- Hash collisions: {data['collisions']:,}",
              "",
              "Names are candidate matches from the external NFS.BIN.Tool dictionary. "
              "Unresolved and colliding hashes are retained explicitly; no guessed names are assigned.",
              "",
              "Only index metadata is committed. No ISO or ZZDATA payload bytes are included.",
              "",
          ]
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\\n".join(lines))
          PY

      - name: Probe vehicle and track resource headers
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_probe.py" \
            --output "$RUNNER_TEMP/zdir_probe.py"
          python3 "$RUNNER_TEMP/zdir_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output iso/resource-probe.csv \
            --limit 32
          python3 - iso/resource-probe.csv iso/resource-probe-report.md <<'PY'
          import csv
          import sys
          with open(sys.argv[1], newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          lines = [
              "# Vehicle and track resource header probe",
              "",
              f"- Unique resources sampled: {len(rows)}",
              "- Sampling: first 64 bytes per resource; no payload files are extracted.",
              "",
              "| Resource | Archive | Offset | Size | First bytes (hex) |",
              "|---|---:|---:|---:|---|",
          ]
          for row in rows:
              lines.append(
                  f"| {row['path']} | {row['archive_id']} | {row['offset']} | "
                  f"{row['size']} | {row['header_hex'] or '(empty)'} |"
              )
          lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\\n".join(lines))
          PY

      - name: Commit inspection reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iso/sha256.txt iso/inspection-report.md iso/zdir-report.md iso/resource-catalogue.csv iso/resource-catalogue-report.md iso/resource-probe.csv iso/resource-probe-report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add ZDIR and ZZDATA validation report"

            # The main branch may advance while the ISO is downloading.
            # Rebase this report commit onto the latest main before pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Remove downloaded ISO and extracted data
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/original.iso" "$RUNNER_TEMP/zdir_inspect.py" "$RUNNER_TEMP/zdir-summary.json"
          rm -rf "$RUNNER_TEMP/game-data"
