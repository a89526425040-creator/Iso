name: Download and inspect PS2 ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/trigger-analysis.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Iso repository
        uses: actions/checkout@v4

      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file

      - name: Download ISO from Yandex Disk
        env:
          YANDEX_PUBLIC_URL: https://disk.yandex.ru/d/B5b8qaTTemfe1w
        run: |
          set -euo pipefail
          API_URL="https://cloud-api.yandex.net/v1/disk/public/resources/download"
          HREF="$(curl --fail --silent --show-error --get \
            --data-urlencode "public_key=$YANDEX_PUBLIC_URL" \
            "$API_URL" | jq -r '.href // empty')"
          if [ -z "$HREF" ]; then
            echo "::error::Yandex Disk did not return a download URL. The link may require access or confirmation."
            exit 1
          fi
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$RUNNER_TEMP/original.iso" "$HREF"
          test -s "$RUNNER_TEMP/original.iso"
          echo "Downloaded file:"
          ls -lh "$RUNNER_TEMP/original.iso"
          file "$RUNNER_TEMP/original.iso"
          sha256sum "$RUNNER_TEMP/original.iso" | tee iso/sha256.txt

      - name: Inspect ISO filesystem and list files
        run: |
          set -euo pipefail
          {
            echo "# ISO inspection report"
            echo
            echo "- Source: public Yandex Disk link"
            echo "- File: original.iso"
            echo "- Size: $(stat -c '%s bytes' "$RUNNER_TEMP/original.iso")"
            echo "- SHA-256: $(sha256sum "$RUNNER_TEMP/original.iso" | awk '{print $1}')"
            echo
            echo "## 7-Zip listing"
            echo ' ```text'
            7z l -slt "$RUNNER_TEMP/original.iso"
            echo ' ```'
          } > iso/inspection-report.md

      - name: Validate ZDIR index against all four ZZDATA archives
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data"
          mkdir -p "$GAME_DIR"
          7z x -y -o"$GAME_DIR" "$RUNNER_TEMP/original.iso" \
            "NFSUNDER/ZDIR.BIN" \
            "NFSUNDER/ZZDATA0.BIN" \
            "NFSUNDER/ZZDATA1.BIN" \
            "NFSUNDER/ZZDATA2.BIN" \
            "NFSUNDER/ZZDATA3.BIN"
          test -s "$GAME_DIR/NFSUNDER/ZDIR.BIN"
          for i in 0 1 2 3; do
            test -s "$GAME_DIR/NFSUNDER/ZZDATA$i.BIN"
          done

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_inspect.py" \
            --output "$RUNNER_TEMP/zdir_inspect.py"

          python3 "$RUNNER_TEMP/zdir_inspect.py" \
            "$GAME_DIR/NFSUNDER/ZDIR.BIN" \
            --archive "0=$GAME_DIR/NFSUNDER/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/NFSUNDER/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/NFSUNDER/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/NFSUNDER/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/zdir-summary.json"

          python3 - "$RUNNER_TEMP/zdir-summary.json" iso/zdir-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          lines = [
              "# ZDIR / ZZDATA validation report",
              "",
              f"- Index size: {data['index_bytes']:,} bytes",
              f"- Record size: {data['record_size']} bytes",
              f"- Records: {data['record_count']:,}",
              f"- Offset unit: {data['sector_size']:,}-byte sectors",
              "- Archive boundary validation: performed against all four extracted archives",
              f"- Validation problems: {data['problem_count']}",
              "",
              "## Archive distribution",
              "",
              "| Archive | Actual size (bytes) | Entries | Declared payload bytes | Highest referenced end offset |",
              "|---|---:|---:|---:|---:|",
          ]
          for aid, item in data["archives"].items():
              lines.append(
                  f"| {item['file']} | {item['archive_bytes']:,} | "
                  f"{item['entry_count']:,} | {item['declared_payload_bytes']:,} | "
                  f"{item['max_end_offset']:,} |"
              )
          if data["problems"]:
              lines.extend(["", "## First validation problems", ""])
              lines.extend(f"- {problem}" for problem in data["problems"])
          else:
              lines.extend(["", "All index entries fit within their referenced archive files."])
          lines.extend([
              "",
              "Only index metadata was committed. The ISO, ZDIR binary, and ZZDATA payloads were temporary runner files.",
              "",
          ])
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: Build resource filename catalogue
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Ekey/NFS.BIN.Tool/main/NFS.Unpacker/NFS.Unpacker/Projects/FileNames.list" \
            --output "$RUNNER_TEMP/FileNames.list"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_inspect.py" \
            --output "$RUNNER_TEMP/zdir_inspect.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_catalog.py" \
            --output "$RUNNER_TEMP/zdir_catalog.py"

          python3 "$RUNNER_TEMP/zdir_catalog.py" \
            "$GAME_DIR/ZDIR.BIN" \
            --names "$RUNNER_TEMP/FileNames.list" \
            --csv iso/resource-catalogue.csv \
            --summary "$RUNNER_TEMP/catalogue-summary.json"

          python3 - "$RUNNER_TEMP/catalogue-summary.json" iso/resource-catalogue-report.md <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          lines = [
              "# Resource filename catalogue",
              "",
              f"- ZDIR entries: {data['entry_count']:,}",
              f"- Candidate paths in external dictionary: {data['name_list_lines']:,}",
              f"- Resolved names: {data['resolved']:,}",
              f"- Unresolved hashes: {data['unresolved']:,}",
              f"- Hash collisions: {data['collisions']:,}",
              "",
              "Names are candidate matches from the external NFS.BIN.Tool dictionary. "
              "Unresolved and colliding hashes are retained explicitly; no guessed names are assigned.",
              "",
              "Only index metadata is committed. No ISO or ZZDATA payload bytes are included.",
              "",
          ]
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines))
          PY

      - name: Probe vehicle and track resource headers
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_probe.py" \
            --output "$RUNNER_TEMP/zdir_probe.py"
          python3 "$RUNNER_TEMP/zdir_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output iso/resource-probe.csv \
            --limit 32
          python3 - iso/resource-probe.csv iso/resource-probe-report.md <<'PY'
          import csv
          import sys
          with open(sys.argv[1], newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          lines = [
              "# Vehicle and track resource header probe",
              "",
              f"- Unique resources sampled: {len(rows)}",
              "- Sampling: first 64 bytes per resource; no payload files are extracted.",
              "",
              "| Resource | Archive | Offset | Size | First bytes (hex) |",
              "|---|---:|---:|---:|---|",
          ]
          for row in rows:
              lines.append(
                  f"| {row['path']} | {row['archive_id']} | {row['offset']} | "
                  f"{row['size']} | {row['header_hex'] or '(empty)'} |"
              )
          lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines))
          PY

      - name: Analyze aligned words and strings in PS2 resource prefixes
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_resource_probe.py" \
            --output "$RUNNER_TEMP/ps2_resource_probe.py"
          python3 "$RUNNER_TEMP/ps2_resource_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/resource-structure.json" \
            --limit 16 \
            --sample-size 256
          python3 - "$RUNNER_TEMP/resource-structure.json" iso/resource-structure-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = json.load(stream)["resources"]
          lines = [
              "# PS2 resource prefix structure probe",
              "",
              f"- Resources inspected: {len(resources)}",
              "- Prefix limit: 256 bytes per resource",
              "- Output contains decoded 32-bit little-endian words and printable strings only; raw payloads are not committed.",
              "",
          ]
          for item in resources:
              lines.extend([
                  f"## {item['path']}",
                  "",
                  f"- File size: {item['file_size']:,} bytes",
                  f"- Archive / byte offset: {item['archive_id']} / {item['offset']:,}",
                  f"- Sample SHA-256: {item['sample_sha256']}",
                  "",
                  "| Offset | u32 little-endian | Decimal |",
                  "|---:|---:|---:|",
              ])
              for word in item["words_le_u32"][:16]:
                  lines.append(
                      f"| 0x{word['offset']:04X} | {word['hex']} | {word['u32']} |"
                  )
              lines.extend(["", "Printable strings:"])
              if item["ascii_strings"]:
                  lines.extend(
                      f"- 0x{entry['offset']:04X}: {entry['text']}"
                      for entry in item["ascii_strings"]
                  )
              else:
                  lines.append("- None in sampled prefix")
              lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Validate PS2 vehicle geometry chunk trees
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_chunk_scan.py" \
            --output "$RUNNER_TEMP/ps2_chunk_scan.py"
          python3 "$RUNNER_TEMP/ps2_chunk_scan.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/vehicle-chunk-trees.json" \
            --limit 8 \
            --min-size 1000000
          python3 - "$RUNNER_TEMP/vehicle-chunk-trees.json" iso/vehicle-chunk-tree-report.md iso/mesh-leaf-probe-report.md iso/cpp-chunk-reader-report.md iso/vif-stream-probe-report.md <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = json.load(stream)["resources"]
          lines = [
              "# PS2 vehicle geometry chunk-tree validation",
              "",
              f"- Complete GEOMETRY.BIN files scanned: {len(resources)}",
              "- Scanner validates every chunk against its parent boundary and recurses only into IDs with top nibble 0x8.",
              "- Only chunk IDs, sizes, offsets and counts are committed; no payload bytes are exported.",
              "",
          ]
          for item in resources:
              scan = item["scan"]
              lines.extend([
                  f"## {item['path']}",
                  "",
                  f"- File size: {scan['file_size']:,} bytes",
                  f"- Chunks: {scan['chunk_count']} ({scan['container_count']} containers, {scan['leaf_count']} leaves)",
                  f"- Padding regions / bytes: {scan['padding_regions']} / {scan['padding_bytes']:,}",
                  f"- Boundary errors: {len(scan['errors'])}",
                  "",
                  "| Chunk ID | Count |",
                  "|---|---:|",
              ])
              for chunk_id, count in scan["id_counts"].items():
                  lines.append(f"| {chunk_id} | {count} |")
              lines.extend(["", "First-level tree (first 24 nodes):", ""])
              def render(nodes, depth=0):
                  for node in nodes:
                      if rendered[0] >= 24:
                          return
                      rendered[0] += 1
                      lines.append(
                          f"- {'  ' * depth}0x{node['offset']:X}: {node['id']} "
                          f"size={node['size']} ({node['kind']})"
                      )
                      render(node["children"], depth + 1)
              rendered = [0]
              render(scan["tree"])
              if scan["errors"]:
                  lines.extend(["", "Errors:"])
                  lines.extend(f"- {error}" for error in scan["errors"])
              lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Probe PS2 mesh leaf numeric layouts
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_mesh_probe.py" \
            --output "$RUNNER_TEMP/ps2_mesh_probe.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_chunk_scan.py" \
            --output "$RUNNER_TEMP/ps2_chunk_scan.py"
          python3 "$RUNNER_TEMP/ps2_mesh_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/mesh-leaf-probe.json" \
            --vehicles 3 \
            --meshes 3
          python3 - "$RUNNER_TEMP/mesh-leaf-probe.json" iso/mesh-leaf-probe-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = json.load(stream)["resources"]
          lines = [
              "# PS2 mesh leaf numeric probe",
              "",
              f"- Vehicle resources: {len(resources)}",
              f"- Geometry containers: {sum(len(item['meshes']) for item in resources)}",
              "- Samples are bounded numeric interpretations of leaf prefixes; raw payload bytes are not committed.",
              "",
          ]
          for item in resources:
              lines.extend([
                  f"## {item['path']}",
                  "",
                  f"- File size: {item['file_size']:,} bytes",
                  f"- Geometry containers in file: {item['geometry_container_count']}",
                  "",
              ])
              for mesh in item["meshes"]:
                  lines.extend([
                      f"### Geometry container {mesh['mesh_index']} at 0x{mesh['container_offset']:X}",
                      "",
                      f"- Container payload size: {mesh['container_size']:,} bytes",
                      "",
                  ])
                  for leaf in mesh["leaves"]:
                      lines.extend([
                          f"#### {leaf['id']} at 0x{leaf['chunk_offset']:X}",
                          "",
                          f"- Payload size: {leaf['payload_size']} bytes",
                          f"- Leading 0x11 / zero bytes: {leaf['leading_0x11_bytes']} / {leaf['leading_zero_bytes']}",
                          f"- First u16 values: {leaf['first_u16']}",
                          f"- First u32 values: {leaf['first_u32_hex']}",
                          f"- Finite f32 candidates: {leaf['first_f32_candidates']}",
                          f"- Size divisibility candidates (skip, stride, records): {leaf['size_divisibility_candidates']}",
                          "",
                      ])
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Decode PS2 VIF streams in vehicle geometry leaves
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_vif_probe.py" \
            --output "$RUNNER_TEMP/ps2_vif_probe.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_chunk_scan.py" \
            --output "$RUNNER_TEMP/ps2_chunk_scan.py"
          python3 "$RUNNER_TEMP/ps2_vif_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/vif-probe.json" \
            --vehicles 3 \
            --meshes 3
          python3 - "$RUNNER_TEMP/vif-probe.json" iso/vif-stream-probe-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = json.load(stream)["resources"]
          lines = [
              "# PS2 VIF stream probe",
              "",
              f"- Vehicle resources: {len(resources)}",
              f"- VIF leaf streams parsed: {sum(len(item['streams']) for item in resources)}",
              "- VIF command lengths and UNPACK payload sizes are bounds-checked; no raw payload bytes are committed.",
              "",
          ]
          for item in resources:
              lines.extend([
                  f"## {item['path']}",
                  "",
                  f"- VIF leaf count in complete resource: {item['geometry_leaf_count']}",
                  "",
              ])
              for index, stream in enumerate(item["streams"]):
                  lines.extend([
                      f"### Stream {index} at 0x{stream['chunk_offset']:X}",
                      "",
                      f"- Chunk payload bytes: {stream['payload_size']}",
                      f"- Leading 0x11 padding bytes: {stream['leading_padding_bytes']}",
                      f"- Parsed commands: {stream['command_count']}",
                      f"- Command counts: {stream['command_counts']}",
                      f"- UNPACK formats: {stream['unpack_format_counts']}",
                      f"- UNPACK vectors: {stream['unpack_vector_count']}",
                      f"- UNPACK data bytes: {stream['unpack_data_bytes']}",
                      f"- Remaining 0x11 padding bytes: {stream['padding_bytes']}",
                      "",
                      "| Offset | Word | Command | NUM | Immediate | Payload bytes |",
                      "|---:|---:|---|---:|---:|---:|",
                  ])
                  for command in stream["commands"][:40]:
                      lines.append(
                          f"| 0x{command['offset']:X} | {command['word']} | "
                          f"{command['label']} | {command['num']} | "
                          f"{command['immediate']} | {command['data_bytes']} |"
                      )
                  if len(stream["commands"]) > 40:
                      lines.append(f"| … | … | {len(stream['commands']) - 40} more commands | | | |")
                  lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Cross-check C++ chunk reader against PS2 resources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/include/nfs" "$RUNNER_TEMP/geometry"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/include/nfs/ea_chunk_reader.hpp" \
            --output "$RUNNER_TEMP/include/nfs/ea_chunk_reader.hpp"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_chunk_cli.cpp" \
            --output "$RUNNER_TEMP/ps2_chunk_cli.cpp"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_chunk_scan.py" \
            --output "$RUNNER_TEMP/ps2_chunk_scan.py"
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I "$RUNNER_TEMP/include" \
            "$RUNNER_TEMP/ps2_chunk_cli.cpp" \
            -o "$RUNNER_TEMP/ps2_chunk_cli"
          python3 - "$RUNNER_TEMP" "$RUNNER_TEMP/ps2_chunk_cli" <<'PY'
          import csv
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          cli = sys.argv[2]
          sys.path.insert(0, str(root))
          from ps2_chunk_scan import flatten, scan_bytes

          game = root / "game-data" / "NFSUNDER"
          archives = {
              0: game / "ZZDATA0.BIN",
              1: game / "ZZDATA1.BIN",
              2: game / "ZZDATA2.BIN",
              3: game / "ZZDATA3.BIN",
          }
          output_dir = root / "geometry"
          lines = [
              "# C++ / Python PS2 chunk reader cross-check",
              "",
              "- Complete PS2 vehicle resources were parsed independently by both readers.",
              "- The comparison requires exact agreement on chunk, container, leaf, and padding counts.",
              "- Extracted files exist only in the temporary workflow runner.",
              "",
          ]
          checked = 0
          with open("iso/resource-catalogue.csv", newline="", encoding="utf-8-sig") as stream:
              for entry in csv.DictReader(stream):
                  path = entry["path"]
                  if (
                      entry.get("resolution") != "resolved"
                      or not path
                      or not path.upper().startswith("CARS\\")
                      or not path.upper().endswith("\\GEOMETRY.BIN")
                      or int(entry["size"]) < 1_000_000
                  ):
                      continue
                  archive_id = int(entry["archive_id"])
                  offset, size = int(entry["byte_offset"]), int(entry["size"])
                  with archives[archive_id].open("rb") as archive:
                      archive.seek(offset)
                      data = archive.read(size)
                  if len(data) != size:
                      raise SystemExit(f"short archive read: {path}")
                  py = scan_bytes(data)
                  if py["errors"]:
                      raise SystemExit(f"Python reader error for {path}: {py['errors'][0]}")
                  resource_file = output_dir / f"vehicle_{checked}.bin"
                  resource_file.write_bytes(data)
                  result = subprocess.run(
                      [cli, str(resource_file)],
                      check=False, capture_output=True, text=True,
                  )
                  if result.returncode:
                      raise SystemExit(f"C++ reader failed for {path}: {result.stderr}")
                  match = re.search(
                      r"chunks=(\d+) containers=(\d+) leaves=(\d+) "
                      r"padding_regions=(\d+) padding_bytes=(\d+)",
                      result.stdout,
                  )
                  if not match:
                      raise SystemExit(f"unrecognized C++ output for {path}: {result.stdout}")
                  cpp_counts = tuple(map(int, match.groups()))
                  nodes = list(flatten(py["nodes"]))
                  py_counts = (
                      len(nodes),
                      sum(node["kind"] == "container" for node in nodes),
                      sum(node["kind"] == "leaf" for node in nodes),
                      len(py["padding"]),
                      sum(item["size"] for item in py["padding"]),
                  )
                  if cpp_counts != py_counts:
                      raise SystemExit(
                          f"reader disagreement for {path}: C++={cpp_counts}, Python={py_counts}"
                      )
                  lines.extend([
                      f"## {path}",
                      "",
                      f"- File bytes: {size:,}",
                      f"- Matching counts (chunks / containers / leaves / padding regions / padding bytes): {cpp_counts}",
                      "",
                      "Chunk ID counts from the C++ reader:",
                      "",
                  ])
                  lines.extend(f"- {line.strip()}" for line in result.stdout.splitlines()[1:])
                  lines.append("")
                  checked += 1
                  if checked >= 8:
                      break
          if checked != 8:
              raise SystemExit(f"expected 8 vehicle resources, checked {checked}")
          with open("iso/cpp-chunk-reader-report.md", "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print(f"C++ and Python readers agreed on {checked} complete PS2 geometry files.")
          PY

      - name: Commit inspection reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iso/sha256.txt iso/inspection-report.md iso/zdir-report.md iso/resource-catalogue.csv iso/resource-catalogue-report.md iso/resource-probe.csv iso/resource-probe-report.md iso/resource-structure-report.md iso/vehicle-chunk-tree-report.md iso/mesh-leaf-probe-report.md iso/cpp-chunk-reader-report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add ZDIR and ZZDATA validation report"

            # The main branch may advance while the ISO is downloading.
            # Rebase this report commit onto the latest main before pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Remove downloaded ISO and extracted data
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/original.iso" "$RUNNER_TEMP/zdir_inspect.py" "$RUNNER_TEMP/zdir-summary.json"
          rm -rf "$RUNNER_TEMP/game-data" "$RUNNER_TEMP/geometry" "$RUNNER_TEMP/include" "$RUNNER_TEMP/ps2_chunk_cli" "$RUNNER_TEMP/ps2_chunk_cli.cpp" "$RUNNER_TEMP/ps2_chunk_scan.py"
