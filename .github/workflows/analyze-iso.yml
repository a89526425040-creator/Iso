          lines = ["# Nested B3300000 / TPK structure", "",
                   f"- Resources inspected: {len(resources)}",
                   f"- Non-empty TPK roots: {sum(bool(x.get('header')) for x in resources)}",
                   "- Payload bytes are not exported or committed.", ""]
          for item in resources:
              lines.extend([f"## {item['path']}", ""])
              if item.get("empty"):
                  lines.extend(["- Empty resource (0 bytes).", ""])
                  continue
              lines.extend([f"- File bytes: {item.get('file_bytes', 0):,}",
                            f"- Root payload bytes: {item.get('root_size', 0):,}",
                            f"- Root end: 0x{item.get('root_end', 0):X}",
                            f"- Texture index / stream entries: {item.get('index_count', 0)} / {item.get('stream_count', 0)}"])
              header = item.get("header")
              if header:
                  lines.extend([f"- Version: {header['version']}",
                                f"- Pack name: `{header['name']}`",
                                f"- Filename: `{header['filename']}`",
                                f"- Filename hash: `{header['filename_hash']}`"])
              lines.extend(["", "Top-level chunks:", "",
                            "| ID | Offset | Payload bytes |", "|---|---:|---:|"])
              for chunk in item.get("top_level", []):
                  lines.append(f"| {chunk['id']} | 0x{chunk['offset']:X} | {chunk['size']:,} |")
              lines.extend(["", "Texture stream entries:", "",
                            "| Name hash | Blob offset | Compressed | Uncompressed | Descriptor word 4 | Descriptor word 5 | Blob |",
                            "|---|---:|---:|---:|---:|---|"])
              for entry in item.get("blob_checks", []):
                  lines.append(f"| `{entry['name_hash']}` | 0x{entry['blob_offset']:X} | {entry['compressed_bytes']:,} | {entry['uncompressed_bytes']:,} | 0x{entry['descriptor_word_4']:08X} | 0x{entry['descriptor_word_5']:08X} | {entry.get('blob_magic', entry.get('blob_error', 'unknown'))} |")
              lines.extend(["", f"Parser errors: `{item.get('errors', [])}`", ""])
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

