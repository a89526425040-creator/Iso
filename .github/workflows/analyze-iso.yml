name: Download and inspect PS2 ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/trigger-analysis.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Iso repository
        uses: actions/checkout@v4

      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file

      - name: Download ISO from Yandex Disk
        env:
          YANDEX_PUBLIC_URL: https://disk.yandex.ru/d/B5b8qaTTemfe1w
        run: |
          set -euo pipefail
          API_URL="https://cloud-api.yandex.net/v1/disk/public/resources/download"
          EXPECTED_BYTES=2882076672
          for attempt in 1 2 3 4 5; do
            echo "ISO download attempt $attempt/5"
            HREF="$(curl --http1.1 --fail --silent --show-error --get \
              --data-urlencode "public_key=$YANDEX_PUBLIC_URL" \
              "$API_URL" | jq -r '.href // empty')"
            if [ -z "$HREF" ]; then
              echo "::warning::Yandex Disk did not return a download URL on attempt $attempt."
              sleep 5
              continue
            fi
            if curl --http1.1 --fail --location --retry 2 --retry-all-errors --retry-delay 5 \
              --continue-at - --output "$RUNNER_TEMP/original.iso" "$HREF"; then
              ACTUAL_BYTES="$(stat -c '%s' "$RUNNER_TEMP/original.iso")"
              if [ "$ACTUAL_BYTES" -eq "$EXPECTED_BYTES" ]; then
                break
              fi
              echo "::warning::Partial ISO download: $ACTUAL_BYTES / $EXPECTED_BYTES bytes."
            fi
            sleep 5
          done
          ACTUAL_BYTES="$(stat -c '%s' "$RUNNER_TEMP/original.iso" 2>/dev/null || echo 0)"
          if [ "$ACTUAL_BYTES" -ne "$EXPECTED_BYTES" ]; then
            echo "::error::ISO download incomplete: $ACTUAL_BYTES / $EXPECTED_BYTES bytes after retries."
            exit 1
          fi
          echo "Downloaded file:"
          ls -lh "$RUNNER_TEMP/original.iso"
          file "$RUNNER_TEMP/original.iso"
          sha256sum "$RUNNER_TEMP/original.iso" | tee iso/sha256.txt

      - name: Inspect ISO filesystem and list files
        run: |
          set -euo pipefail
          {
            echo "# ISO inspection report"
            echo
            echo "- Source: public Yandex Disk link"
            echo "- File: original.iso"
            echo "- Size: $(stat -c '%s bytes' "$RUNNER_TEMP/original.iso")"
            echo "- SHA-256: $(sha256sum "$RUNNER_TEMP/original.iso" | awk '{print $1}')"
            echo
            echo "## 7-Zip listing"
            echo ' ```text'
            7z l -slt "$RUNNER_TEMP/original.iso"
            echo ' ```'
          } > iso/inspection-report.md

      - name: Inspect PS2 executable and VU microprogram candidates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/executable"
          7z x -y -o"$RUNNER_TEMP/executable" "$RUNNER_TEMP/original.iso" "SLUS_210.65"
          EXE="$RUNNER_TEMP/executable/SLUS_210.65"
          test -s "$EXE"
          {
            echo "# PS2 executable inspection"
            echo
            echo "- File: SLUS_210.65"
            echo "- Size: $(stat -c '%s bytes' "$EXE")"
            echo "- SHA-256: $(sha256sum "$EXE" | awk '{print $1}')"
            echo
            echo "## File identification"
            echo '\`\`\`text'
            file "$EXE"
            echo '\`\`\`'
            echo
            echo "## ELF header and program segments"
            echo '\`\`\`text'
            readelf -h -l "$EXE" 2>&1 || true
            echo '\`\`\`'
            echo
            echo "## ELF sections"
            echo '\`\`\`text'
            readelf -SW "$EXE" 2>&1 || true
            echo '\`\`\`'
            echo
            echo "## VU / VIF / geometry-related strings"
            echo '\`\`\`text'
            strings -a -n 4 "$EXE" | grep -Ei 'vu[01]|vif|micro(code)?|geometry|mesh|render|draw|vertex|polygon' | head -200 || true
            echo '\`\`\`'
          } > iso/executable-analysis-report.md

      - name: Extract PS2 VU text and overlay sections
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/executable/SLUS_210.65"
          OUT="$RUNNER_TEMP/vu-sections"
          mkdir -p "$OUT"
          python3 - "$EXE" "$OUT" <<'PY'
          import struct, sys
          from pathlib import Path
          exe, out = Path(sys.argv[1]), Path(sys.argv[2])
          data = exe.read_bytes()
          if data[:6] != bytes.fromhex("7f454c460101"):
              raise SystemExit("Expected ELF32 little-endian PS2 executable")
          header = struct.unpack_from("<16sHHIIIIIHHHHHH", data, 0)
          shoff, shentsize, shnum, shstrndx = header[6], header[11], header[12], header[13]
          sections = [struct.unpack_from("<IIIIIIIIII", data, shoff + i * shentsize) for i in range(shnum)]
          names_section = sections[shstrndx]
          names = data[names_section[4]:names_section[4] + names_section[5]]
          index = []
          for section in sections:
              name_offset, section_type, flags, address, offset, size = section[:6]
              end_name = names.find(bytes([0]), name_offset)
              name = names[name_offset:end_name].decode("ascii", "replace")
              wanted = name == ".vutext" or name in (".DVP.ovlytab", ".DVP.ovlystrtab") or name.startswith(".DVP.overlay.")
              if not wanted or section_type == 8:
                  continue
              if offset + size > len(data):
                  raise SystemExit(f"Section {name} exceeds executable bounds")
              filename = name.replace("/", "_") + ".bin"
              (out / filename).write_bytes(data[offset:offset + size])
              index.append((name, size, address, filename))
          (out / "overlay-index.txt").write_text(
              "\n".join(f"{name} size={size} vma=0x{address:X} file={filename}" for name,size,address,filename in index) + "\n",
              encoding="utf-8")
          print(f"Extracted {len(index)} VU/DVP sections.")
          PY
          {
            echo "# PS2 VU executable sections"
            echo
            echo "## Extracted section index"
            cat "$OUT/overlay-index.txt"
            echo
            for section in "$OUT"/*.bin; do
              [ -f "$section" ] || continue
              echo "## $(basename "$section")"
              echo "- Bytes: $(stat -c '%s' "$section")"
              echo "- SHA-256: $(sha256sum "$section" | awk '{print $1}')"
              xxd -g 4 -c 16 "$section" | head -160
              echo
              strings -a -t x -n 3 "$section" | head -80 || true
              echo
            done
            echo "## Cross MIPS disassembler availability"
            mipsel-linux-gnu-objdump -i | grep -Ei 'mips|5900' | head -60 || true
          } > iso/vu-section-analysis-report.md

      - name: Disassemble VU microprogram uploads from the PS2 executable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vu-tools"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/gothamor/gta-vcs-recomp/main/tools/vudis.py" \
            --output "$RUNNER_TEMP/vu-tools/vudis.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/gothamor/gta-vcs-recomp/main/tools/vu1_recomp.py" \
            --output "$RUNNER_TEMP/vu-tools/vu1_recomp.py"
          python3 - "$RUNNER_TEMP/executable/SLUS_210.65" "$RUNNER_TEMP/vu-tools" iso/vu-program-disassembly-report.md <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[2])
          import vu1_recomp as vr
          import vudis
          elf = Path(sys.argv[1])
          vaddr, stream = vr.read_vutext(str(elf))
          programs = vr.program_sets(vaddr, stream)
          lines = [
              "# PS2 VU microprogram disassembly",
              "",
              f"- Executable section virtual address: 0x{vaddr:X}",
              f"- .vutext bytes: {len(stream):,}",
              f"- VU microprogram blocks: {len(programs)}",
              "- Disassembly is derived from MPG uploads found in the executable's .vutext VIF stream.",
              "",
          ]
          if not programs:
              lines.append("No MPG upload blocks were recognized by the VIF packet scanner.")
          for index, program in enumerate(programs):
              code = program["code"]
              vu = program["vu"]
              image = bytes(vu) + code
              listing = vudis.disassemble(image, vu, vu + len(code), False)
              ebit = sum(" E" in line for line in listing)
              xgkick = sum("XGKICK" in line for line in listing)
              reserved = sum("reserved" in line for line in listing)
              lines.extend([
                  f"## Program {index + 1}",
                  "",
                  f"- VIF source offset: 0x{program['source'] - vaddr:X}",
                  f"- VU destination address: 0x{vu:X}",
                  f"- Code bytes / instruction pairs: {len(code):,} / {len(code) // 8:,}",
                  f"- E-bit instructions: {ebit}",
                  f"- XGKICK instructions: {xgkick}",
                  f"- Reserved/unknown decoded instructions: {reserved}",
                  "",
                  "```asm",
              ])
              lines.extend(listing)
              lines.extend(["```", ""])
          Path(sys.argv[3]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Disassembled {len(programs)} VU microprogram blocks.")
          PY

      - name: Resolve DVP overlays and inspect all PS2 VU programs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vu-overlays"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_dvp_overlay_probe.py" \
            --output "$RUNNER_TEMP/ps2_dvp_overlay_probe.py"
          python3 "$RUNNER_TEMP/ps2_dvp_overlay_probe.py" \
            "$RUNNER_TEMP/executable/SLUS_210.65" \
            --out-dir "$RUNNER_TEMP/vu-overlays" \
            --json "$RUNNER_TEMP/dvp-overlays.json"
          python3 - "$RUNNER_TEMP/dvp-overlays.json" "$RUNNER_TEMP/vu-overlays" "$RUNNER_TEMP/vu-tools" iso/dvp-overlay-report.md <<'PY'
          import json, pathlib, struct, sys
          report_path, binary_dir, tool_dir, output = map(pathlib.Path, sys.argv[1:])
          sys.path.insert(0, str(tool_dir))
          import vudis
          report = json.loads(report_path.read_text(encoding="utf-8"))
          lines = ["# PS2 DVP overlay microprograms", "",
                   f"- DVP table entries: {report['table_entries']}",
                   f"- Grouped overlay programs: {len(report['programs'])}",
                   f"- Table errors: {len(report['errors'])}",
                   "- Overlay payloads are analysed in the runner and are not committed.", ""]
          for error in report["errors"]:
              lines.append(f"- ERROR: {error}")
          for program in report["programs"]:
              raw = (binary_dir / program["file"]).read_bytes()
              if len(raw) % 8:
                  lines.append(f"## Program {program['program_id']} — malformed size {len(raw)}")
                  continue
              pairs = len(raw) // 8
              ebit = xgkick = reserved = 0
              for pos in range(0, len(raw), 8):
                  lower, upper = struct.unpack_from("<II", raw, pos)
                  ebit += bool(upper & (1 << 30))
              base = bytes(program["vu_start"]) + raw
              disasm = vudis.disassemble(base, program["vu_start"], program["vu_start"] + len(raw), False)
              xgkick = sum("XGKICK" in line for line in disasm)
              reserved = sum("reserved" in line.lower() for line in disasm)
              lines.extend([f"## Program {program['program_id']} at VU 0x{program['vu_start']:04X}", "",
                            f"- Chunks: {program['chunk_count']}", f"- Code bytes / instruction pairs: {len(raw)} / {pairs}",
                            f"- Chunk addresses contiguous: {program['contiguous']}",
                            f"- E-bit instructions: {ebit}", f"- XGKICK instructions: {xgkick}",
                            f"- Reserved/unknown instructions: {reserved}", ""])
              interesting = [line for line in disasm if "XGKICK" in line or " E" in line or "reserved" in line.lower()]
              sample = disasm if program["vu_start"] == 0 and len(raw) <= 0x800 else (disasm[:32] + interesting[:40])
              lines.extend(["```asm", *sample, "```", ""])
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Validate ZDIR index against all four ZZDATA archives
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data"
          mkdir -p "$GAME_DIR"
          7z x -y -o"$GAME_DIR" "$RUNNER_TEMP/original.iso" \
            "NFSUNDER/ZDIR.BIN" \
            "NFSUNDER/ZZDATA0.BIN" \
            "NFSUNDER/ZZDATA1.BIN" \
            "NFSUNDER/ZZDATA2.BIN" \
            "NFSUNDER/ZZDATA3.BIN"
          test -s "$GAME_DIR/NFSUNDER/ZDIR.BIN"
          for i in 0 1 2 3; do
            test -s "$GAME_DIR/NFSUNDER/ZZDATA$i.BIN"
          done

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_inspect.py" \
            --output "$RUNNER_TEMP/zdir_inspect.py"

          python3 "$RUNNER_TEMP/zdir_inspect.py" \
            "$GAME_DIR/NFSUNDER/ZDIR.BIN" \
            --archive "0=$GAME_DIR/NFSUNDER/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/NFSUNDER/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/NFSUNDER/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/NFSUNDER/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/zdir-summary.json"

          python3 - "$RUNNER_TEMP/zdir-summary.json" iso/zdir-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          lines = [
              "# ZDIR / ZZDATA validation report",
              "",
              f"- Index size: {data['index_bytes']:,} bytes",
              f"- Record size: {data['record_size']} bytes",
              f"- Records: {data['record_count']:,}",
              f"- Offset unit: {data['sector_size']:,}-byte sectors",
              "- Archive boundary validation: performed against all four extracted archives",
              f"- Validation problems: {data['problem_count']}",
              "",
              "## Archive distribution",
              "",
              "| Archive | Actual size (bytes) | Entries | Declared payload bytes | Highest referenced end offset |",
              "|---|---:|---:|---:|---:|",
          ]
          for aid, item in data["archives"].items():
              lines.append(
                  f"| {item['file']} | {item['archive_bytes']:,} | "
                  f"{item['entry_count']:,} | {item['declared_payload_bytes']:,} | "
                  f"{item['max_end_offset']:,} |"
              )
          if data["problems"]:
              lines.extend(["", "## First validation problems", ""])
              lines.extend(f"- {problem}" for problem in data["problems"])
          else:
              lines.extend(["", "All index entries fit within their referenced archive files."])
          lines.extend([
              "",
              "Only index metadata was committed. The ISO, ZDIR binary, and ZZDATA payloads were temporary runner files.",
              "",
          ])
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: Build resource filename catalogue
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Ekey/NFS.BIN.Tool/main/NFS.Unpacker/NFS.Unpacker/Projects/FileNames.list" \
            --output "$RUNNER_TEMP/FileNames.list"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_inspect.py" \
            --output "$RUNNER_TEMP/zdir_inspect.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_catalog.py" \
            --output "$RUNNER_TEMP/zdir_catalog.py"

          python3 "$RUNNER_TEMP/zdir_catalog.py" \
            "$GAME_DIR/ZDIR.BIN" \
            --names "$RUNNER_TEMP/FileNames.list" \
            --csv iso/resource-catalogue.csv \
            --summary "$RUNNER_TEMP/catalogue-summary.json"

          python3 - "$RUNNER_TEMP/catalogue-summary.json" iso/resource-catalogue-report.md <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          lines = [
              "# Resource filename catalogue",
              "",
              f"- ZDIR entries: {data['entry_count']:,}",
              f"- Candidate paths in external dictionary: {data['name_list_lines']:,}",
              f"- Resolved names: {data['resolved']:,}",
              f"- Unresolved hashes: {data['unresolved']:,}",
              f"- Hash collisions: {data['collisions']:,}",
              "",
              "Names are candidate matches from the external NFS.BIN.Tool dictionary. "
              "Unresolved and colliding hashes are retained explicitly; no guessed names are assigned.",
              "",
              "Only index metadata is committed. No ISO or ZZDATA payload bytes are included.",
              "",
          ]
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines))
          PY

      - name: Probe vehicle and track resource headers
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/zdir_probe.py" \
            --output "$RUNNER_TEMP/zdir_probe.py"
          python3 "$RUNNER_TEMP/zdir_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output iso/resource-probe.csv \
            --limit 32
          python3 - iso/resource-probe.csv iso/resource-probe-report.md <<'PY'
          import csv
          import sys
          with open(sys.argv[1], newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          lines = [
              "# Vehicle and track resource header probe",
              "",
              f"- Unique resources sampled: {len(rows)}",
              "- Sampling: first 64 bytes per resource; no payload files are extracted.",
              "",
              "| Resource | Archive | Offset | Size | First bytes (hex) |",
              "|---|---:|---:|---:|---|",
          ]
          for row in rows:
              lines.append(
                  f"| {row['path']} | {row['archive_id']} | {row['offset']} | "
                  f"{row['size']} | {row['header_hex'] or '(empty)'} |"
              )
          lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines))
          PY

      - name: Analyze aligned words and strings in PS2 resource prefixes
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_resource_probe.py" \
            --output "$RUNNER_TEMP/ps2_resource_probe.py"
          python3 "$RUNNER_TEMP/ps2_resource_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/resource-structure.json" \
            --limit 16 \
            --sample-size 256
          python3 - "$RUNNER_TEMP/resource-structure.json" iso/resource-structure-report.md <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = json.load(stream)["resources"]
          lines = [
              "# PS2 resource prefix structure probe",
              "",
              f"- Resources inspected: {len(resources)}",
              "- Prefix limit: 256 bytes per resource",
              "- Output contains decoded 32-bit little-endian words and printable strings only; raw payloads are not committed.",
              "",
          ]
          for item in resources:
              lines.extend([
                  f"## {item['path']}",
                  "",
                  f"- File size: {item['file_size']:,} bytes",
                  f"- Archive / byte offset: {item['archive_id']} / {item['offset']:,}",
                  f"- Sample SHA-256: {item['sample_sha256']}",
                  "",
                  "| Offset | u32 little-endian | Decimal |",
                  "|---:|---:|---:|",
              ])
              for word in item["words_le_u32"][:16]:
                  lines.append(
                      f"| 0x{word['offset']:04X} | {word['hex']} | {word['u32']} |"
                  )
              lines.extend(["", "Printable strings:"])
              if item["ascii_strings"]:
                  lines.extend(
                      f"- 0x{entry['offset']:04X}: {entry['text']}"
                      for entry in item["ascii_strings"]
                  )
              else:
                  lines.append("- None in sampled prefix")
              lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Inspect PS2 car texture archives
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_texture_probe.py" \
            --output "$RUNNER_TEMP/ps2_texture_probe.py"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_chunk_scan.py" \
            --output "$RUNNER_TEMP/ps2_chunk_scan.py"
          python3 "$RUNNER_TEMP/ps2_texture_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
            --output "$RUNNER_TEMP/texture-probe.json"
          python3 - "$RUNNER_TEMP/texture-probe.json" iso/texture-probe-report.md <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = json.load(stream)["resources"]
          lines = ["# PS2 car texture archive probe", "",
                   f"- Texture archives inspected: {len(resources)}",
                   "- No proprietary texture payloads are committed.", ""]
          for item in resources:
              lines.extend([f"## {item['path']}", "",
                  f"- Size: {item['file_size']:,} bytes",
                  f"- Archive / offset: {item['archive_id']} / {item['archive_offset']:,}",
                  f"- Prefix: `{item['prefix_hex']}`",
                  f"- Chunk counts: {item['chunk_count']} total, {item['container_count']} containers, {item['leaf_count']} leaves",
                  f"- Chunk IDs: `{item['chunk_ids']}`",
                  f"- Known image signatures: `{item['signatures']}`",
                  f"- Validated embedded images: {len(item['validated_images'])}",
                  f"- Image metadata: `{item['validated_images']}`",
                  f"- Chunk parser errors: `{item['chunk_errors']}`", "",
                  "Top-level chunks:", "",
                  "| ID | Offset | Size | Kind |", "|---|---:|---:|---|"])
              for node in item["top_level"]:
                  lines.append(f"| {node['id']} | 0x{node['offset']:X} | {node['size']} | {node['kind']} |")
              lines.append("")
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Parse nested B3300000 TPK texture packs
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game-data/NFSUNDER"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/a89526425040-creator/Nfs/main/tools/ps2_tpk_probe.py" \
            --output "$RUNNER_TEMP/ps2_tpk_probe.py"
          python3 "$RUNNER_TEMP/ps2_tpk_probe.py" \
            iso/resource-catalogue.csv \
            --archive "0=$GAME_DIR/ZZDATA0.BIN" \
            --archive "1=$GAME_DIR/ZZDATA1.BIN" \
            --archive "2=$GAME_DIR/ZZDATA2.BIN" \
            --archive "3=$GAME_DIR/ZZDATA3.BIN" \
